name: Security Scan

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements.txt || echo "requirements.txt not found, skipping"

      - name: Run pip-audit (Dependency Vulnerability Scan)
        run: |
          source .venv/bin/activate
          pip install pip-audit
          pip-audit --requirement requirements.txt --format json --output pip-audit-report.json || true
          pip-audit --requirement requirements.txt || true
        continue-on-error: true

      - name: Run Bandit (Python Code Security Linter)
        run: |
          source .venv/bin/activate
          pip install bandit[toml]
          bandit -r genreport/ -f json -o bandit-report.json || true
          bandit -r genreport/ -ll || true
        continue-on-error: true

      - name: Run Safety (Alternative Dependency Scanner)
        run: |
          source .venv/bin/activate
          pip install safety
          safety check --json --output safety-report.json || true
          safety check || true
        continue-on-error: true

      - name: Upload Python Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-reports
          path: |
            pip-audit-report.json
            bandit-report.json
            safety-report.json
          retention-days: 30

      - name: Check for Critical Vulnerabilities
        run: |
          echo "Checking for critical vulnerabilities..."

          # Check pip-audit results
          if [ -f pip-audit-report.json ]; then
            CRITICAL_COUNT=$(jq '.dependencies[].vulnerabilities[] | select(.severity == "critical" or .severity == "high") | .id' pip-audit-report.json 2>/dev/null | wc -l || echo "0")
            echo "pip-audit found $CRITICAL_COUNT critical/high vulnerabilities"

            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "::warning::Found $CRITICAL_COUNT critical/high severity vulnerabilities in dependencies"
            fi
          fi

          # Check bandit results
          if [ -f bandit-report.json ]; then
            HIGH_SEVERITY=$(jq '.results[] | select(.issue_severity == "HIGH")' bandit-report.json 2>/dev/null | jq -s 'length' || echo "0")
            echo "Bandit found $HIGH_SEVERITY high severity issues"

            if [ "$HIGH_SEVERITY" -gt 0 ]; then
              echo "::warning::Found $HIGH_SEVERITY high severity security issues in code"
            fi
          fi

  frontend-security:
    name: Frontend Security Scan
    runs-on: ubuntu-latest

    # Only run if frontend directory exists
    if: hashFiles('frontend/package.json') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend || exit 0
          npm ci || npm install

      - name: Run npm audit
        run: |
          cd frontend || exit 0
          npm audit --json > ../npm-audit-report.json || true
          npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Upload Frontend Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-security-reports
          path: npm-audit-report.json
          retention-days: 30

  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest

    # Only run if Dockerfile exists
    if: hashFiles('Dockerfile') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-results.sarif
          retention-days: 30

  security-test-suite:
    name: Run Security Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genreport_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements.txt || echo "requirements.txt not found"
          uv pip install pytest pytest-cov

      - name: Run OWASP Top 10 Security Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genreport_test
        run: |
          source .venv/bin/activate
          pytest tests/security/test_owasp_top10.py -v --tb=short

      - name: Upload Security Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: |
            .pytest_cache/
          retention-days: 30

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [python-security, security-test-suite]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Generate Security Summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Python Security
          echo "### Python Security" >> $GITHUB_STEP_SUMMARY
          if [ -f python-security-reports/pip-audit-report.json ]; then
            echo "- ✅ pip-audit completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ pip-audit report not found" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f python-security-reports/bandit-report.json ]; then
            echo "- ✅ Bandit completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ Bandit report not found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Security test suite execution completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "1. Review all security reports in the artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Address any HIGH or CRITICAL severity findings" >> $GITHUB_STEP_SUMMARY
          echo "3. Update dependencies with known vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "4. Re-run security tests after fixes" >> $GITHUB_STEP_SUMMARY
